<button
  [type]="type"
  [disabled]="isDisabled"
  [class]="hostClasses.join(' ')"
  [attr.aria-label]="ariaLabel"
  [attr.aria-busy]="loading"
  (click)="onClick($event)"
>
  <span class="ui-btn__spinner" *ngIf="loading" aria-hidden="true"></span>
  
  <span class="ui-btn__label">
    <ng-content></ng-content>
  </span>

  <span 
    class="u-sr-only" 
    role="status" 
    aria-live="polite">
    {{ loading ? 'Analyse en cours...' : '' }}
  </span>
</button>
