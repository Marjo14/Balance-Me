<div [class]="rootClasses.join(' ')">
  
  <label *ngIf="label" class="ui-select__label" [attr.for]="selectId">
    {{ label }}
  </label>

  <div class="ui-select__control">
    <div style="color: inherit"> 
      <select
        class="ui-select__native"
        [id]="selectId"
        [disabled]="disabled"
        [value]="value ?? ''"
        (change)="onChange($event)"
        [class.placeholder-shown]="!value"
        required
      >
        <option value="" disabled selected hidden>{{ placeholder }}</option>

        <option *ngFor="let opt of options" [value]="opt.value">
          {{ opt.label }}
        </option>
      </select>

      <svg class="ui-select__chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor">
        <path d="M5 7.5L10 12.5L15 7.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <div *ngIf="error" class="ui-select__error">
    {{ error }}
  </div>
</div>
