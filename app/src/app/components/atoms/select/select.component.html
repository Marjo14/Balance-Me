<div [class]="rootClasses.join(' ')">
  <label *ngIf="label" class="ui-radio-group__label">{{ label }}</label>

  <div class="ui-radio-grid" role="radiogroup">
    <label 
      *ngFor="let opt of options" 
      class="ui-radio-card" 
      [class.is-selected]="value === opt.value"
      [class.is-disabled]="disabled"
    >
      <input 
        type="radio" 
        [name]="selectId" 
        [value]="opt.value" 
        [checked]="value === opt.value"
        [disabled]="disabled"
        (change)="onRadioChange(opt.value)"
      >
      <span class="ui-radio-card__text">{{ opt.label }}</span>
    </label>
  </div>

  <div *ngIf="error" class="ui-radio-group__error" role="alert">
    {{ error }}
  </div>
</div>
