<label class="input-label" [attr.for]="id || null">
  {{ label }}

  <input
    class="input-field u-focus"
    [id]="id || null"
    [name]="name || null"
    [type]="type"
    [placeholder]="placeholder"
    [disabled]="disabled"
    [value]="value"
    (input)="valueChange.emit(($any($event.target).value))"
    [attr.inputmode]="type === 'number' ? 'decimal' : null"
    [attr.aria-label]="label"
  />
</label>
